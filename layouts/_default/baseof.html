<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/main.css" />
  {{ template "_internal/google_analytics.html" . }}
</head>

<body>
  <nav>
    <a class="nav-home" href="/">{{ .Site.Title }}</a>
    <div class="nav-links">
      <a href="/posts">Posts</a>
      <a href="/about">About</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </nav>

  {{ block "main" . }}{{ end }}

  <footer>
    <span>© {{ now.Year }} {{ .Site.Params.Name }} · {{ .Site.Params.location }}</span>
    <span>
      <a href="mailto:{{ .Site.Params.email }}">Email</a> |
      <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn</a> |
      <a href="{{ .Site.Params.x }}" target="_blank" rel="noopener">X (Twitter)</a> |
      <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
    </span>
  </footer>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>
</body>

</html>
