{{ define "main" }}

<article class="page-content">
  {{ .Content }}
</article>

{{ $posts := where .Site.RegularPages "Section" "posts" }}
{{ if $posts }}
<section class="posts-section">
  <h2>Posts</h2>
  <ul class="post-list">
    {{ range first 5 $posts }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
      <span class="post-date">{{ .Date.Format "Jan 2006" }}</span>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}

{{ end }}
